services:
  envwitness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: envwitness:1.0.0
    command:
      - capture
      - --config
      - /etc/envwitness/envwitness.yml
      - --project-root
      - /workspace
      - --output
      - /workspace/${ENVWITNESS_OUTPUT:-envwitness-capture.evw}
    volumes:
      - type: bind
        source: ${ENVWITNESS_PROJECT_PATH:-..}
        target: /workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
