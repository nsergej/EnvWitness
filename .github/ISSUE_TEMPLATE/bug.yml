name: Bug report
description: Report reproducible incorrect behavior without disclosing secrets.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: Review every capsule and log before attaching it. Use private vulnerability reporting for suspected secret exposure.
  - type: input
    id: version
    attributes:
      label: EnvWitness version
      placeholder: Output of envwitness version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include complete commands, a minimal configuration, and deterministic steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed all attached evidence and removed confidential data.
          required: true
