name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[development]"
      - run: python -m ruff format --check src tests examples scripts
      - run: python -m ruff check src tests examples scripts
      - run: python -m mypy src
      - run: python -m bandit -c pyproject.toml -r src
      - run: python scripts/render_cli_demo.py
      - run: python scripts/validate_repository.py
      - run: python -m pip_audit . --progress-spinner off
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.operating-system }}
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[development]"
      - run: python -m pytest

  package-smoke:
    name: Wheel smoke / ${{ matrix.operating-system }}
    needs: quality
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install built wheel
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheel = next(Path('dist').glob('*.whl'));
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel)], check=True)"
      - run: envwitness version
      - run: envwitness --help

  docker-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t envwitness:ci .
      - run: docker run --rm envwitness:ci --help
      - name: Capture and verify in the container
        run: |
          mkdir docker-smoke
          chmod 0777 docker-smoke
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD/docker-smoke:/workspace" \
            envwitness:ci capture --project-root /workspace --output /workspace/smoke.evw
          test -s docker-smoke/smoke.evw
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD/docker-smoke:/workspace:ro" \
            envwitness:ci verify /workspace/smoke.evw
