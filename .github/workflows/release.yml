name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build, verify, and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[development]"
      - name: Verify release tag and notes
        run: >-
          python -c "import os; from pathlib import Path; from envwitness import __version__;
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{__version__}', f'{tag} does not match {__version__}';
          assert Path(f'release/{tag}.md').is_file(), f'missing release/{tag}.md'"
      - run: python -m ruff format --check src tests examples scripts
      - run: python -m ruff check src tests examples scripts
      - run: python -m mypy src
      - run: python -m bandit -c pyproject.toml -r src
      - run: python scripts/validate_repository.py
      - run: python -m pytest
      - run: python -m pip_audit . --progress-spinner off
      - run: python -m build
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/envwitness-release-smoke
          /tmp/envwitness-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/envwitness-release-smoke/bin/envwitness version
          /tmp/envwitness-release-smoke/bin/envwitness --help >/dev/null
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/envwitness-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.spdx.json > SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Create release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "EnvWitness $GITHUB_REF_NAME"
          --notes-file "release/$GITHUB_REF_NAME.md"
